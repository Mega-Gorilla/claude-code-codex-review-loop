# SPDX-License-Identifier: Apache-2.0

name: test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,p001]" -c constraints/p001.txt

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Run tests with coverage
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        # tmp directoryをworkspace内の固定位置へ置き、失敗時に成果物を収集できるようにする
        run: python -m coverage run -m pytest -q --basetemp=.pytest-tmp

      - name: Combine coverage data
        run: python -m coverage combine

      - name: Enforce coverage floor
        shell: bash
        run: |
          floor=$(python -c "import tomllib; print(tomllib.load(open('quality-baseline.toml','rb'))['coverage']['floor'])")
          # C-03 / C-06のOS専用backendは自OSのjobでのみ実行できるため、異OS側moduleだけを
          # report対象から除外する（floor値は変更しない）。CONTRIBUTING「品質ゲートの運用」を参照。
          if [ "$RUNNER_OS" = "Windows" ]; then
            omit="*/process/process_group.py,*/identity/mode_posix.py"
          else
            omit="*/process/job_object.py,*/identity/acl_windows.py"
          fi
          python -m coverage report --fail-under="$floor" --omit="$omit"

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Check pushed commit diff
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${BEFORE_SHA:-}"
          if [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          if [ -n "${base}" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi
          if [ -z "${base}" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          echo "Checking ${base}..${AFTER_SHA}"
          git diff --check "${base}" "${AFTER_SHA}"

      # 失敗したjobのstate（checkpointとenvelope / result）だけを収集する。何が起きたかは
      # C-08のstateに現れるが、CIのlogには残らないためである。
      #
      # **収集対象はpath patternで限定する**。run directory配下のcheckpointとenvelope /
      # resultに絞り、session config（`gh_env`を持つ）とfake GitHubのstateは含めない。
      # 実行するのはfake ghだけなので実credentialは存在しないが、収集範囲を「絞る」ことを
      # 既定にしておかないと、実transportを使うPhaseで漏れる。
      - name: Collect run state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-state-${{ matrix.os }}
          path: |
            .pytest-tmp/**/runs/*/checkpoint.json
            .pytest-tmp/**/runs/*/actions/*/*.json
            .pytest-tmp/**/runs/*/requests/*/*.json
          if-no-files-found: ignore
          retention-days: 7
