# SPDX-License-Identifier: Apache-2.0

name: test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

# 同一PRへの連続pushでは古いcommitのrunを打ち切る。mainとtagへのpushは打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 実測はubuntu約3分 / windows約5分。subprocessを起動するtestがhangしても既定の360分を占有しない。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
        # 下限の3.11に加え、開発機で使う最新系でも同じgateを通す（Issue #63）。
        # `Python 3.11 / <os>`のjob名はrulesetの必須status checkなので変えない。
        include:
          - os: ubuntu-latest
            python-version: "3.13"

    # actionはmutableなmajor tagではなくcommit SHAで固定する（supply-chainの置換防止）。
    # 更新は`.github/dependabot.yml`のgithub-actions更新PRで行い、末尾のversion commentも揃える。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,p001]" -c constraints/p001.txt

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Run tests with coverage
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        # tmp directoryを固定位置へ置き、失敗時に成果物を収集できるようにする。
        #
        # **workspace内へは置けない**。`tests/test_c06_isolation.py`はreviewer用のgit呼び出しが
        # 隔離home外のconfigを読まないことを検証しており、tmp directoryがこのrepository配下に
        # あると、cwdから発見されるrepository localの`.git/config`がoriginへ混ざる。
        run: python -m coverage run -m pytest -q --basetemp="${{ runner.temp }}/pytest-tmp"

      - name: Combine coverage data
        run: python -m coverage combine

      - name: Enforce coverage floor
        shell: bash
        run: |
          floor=$(python -c "import tomllib; print(tomllib.load(open('quality-baseline.toml','rb'))['coverage']['floor'])")
          # C-03 / C-06のOS専用backendは自OSのjobでのみ実行できるため、異OS側moduleだけを
          # report対象から除外する（floor値は変更しない）。CONTRIBUTING「品質ゲートの運用」を参照。
          if [ "$RUNNER_OS" = "Windows" ]; then
            omit="*/process/process_group.py,*/identity/mode_posix.py"
          else
            omit="*/process/job_object.py,*/identity/acl_windows.py"
          fi
          python -m coverage report --fail-under="$floor" --omit="$omit"

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Check pushed commit diff
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${BEFORE_SHA:-}"
          if [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          if [ -n "${base}" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi
          if [ -z "${base}" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          echo "Checking ${base}..${AFTER_SHA}"
          git diff --check "${base}" "${AFTER_SHA}"

      # 失敗したjobのcheckpointとenvelopeだけを収集する。何が起きたかはC-08のstateに
      # 現れるが、CIのlogには残らないためである。
      #
      # **収集対象はfile名まで指定して限定する**（Issue #13: 未redact入力を含めない）。
      #
      # - `checkpoint.json`: `transaction.body`は**redact済み**のrender出力（ADR-0015）
      # - `action.json` / `request.json`: envelope。binding・hash・comment ID・action payloadで、
      #   自由記述を持たない
      # - `host.log`: headless hostのstderrを`policy.redaction`へ通したもの（ADR-0022）
      # - `result.json` / `host.stdout` / `host.stderr`は**含めない**。hostが返した実行結果と
      #   ユーザーの入力そのもの、およびredact前のlogが入る。session config（`gh_env`を持つ）と
      #   fake GitHubのstateも同様に外す
      #
      # 実行するのはfake ghだけなので実credentialは存在しないが、収集範囲を「絞る」ことを
      # 既定にしておかないと、実transportを使うPhaseで漏れる。file名の対応は
      # `tests/test_c08_artifact_contract.py`が製品定数と突き合わせて固定する。
      #
      # directory名を`.`で始めない。upload-artifactは`include-hidden-files`が既定false
      # であり、hidden pathは黙って収集対象から外れる。
      - name: Collect run state on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-state-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/pytest-tmp/**/runs/*/checkpoint.json
            ${{ runner.temp }}/pytest-tmp/**/runs/*/actions/*/action.json
            ${{ runner.temp }}/pytest-tmp/**/runs/*/actions/*/host.log
            ${{ runner.temp }}/pytest-tmp/**/runs/*/requests/*/request.json
            ${{ runner.temp }}/pytest-tmp/**/runs/*/requests/*/host.log
          if-no-files-found: ignore
          retention-days: 7
