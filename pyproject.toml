# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-codex-review-loop"
version = "0.0.0"
description = "Human-gated GitHub Issue and PR development loop with Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Mega-Gorilla" },
]
dependencies = []

[project.optional-dependencies]
# 開発用依存。ratchetを安定させるため、直接依存をexact pinとする（推移依存は固定しない）。
# runtime依存の方針はP-001（Phase 0のPR 2）で決定し、ここへは含めない。
dev = [
  "pytest==9.1.1",
  "ruff==0.16.3",
  "mypy==2.3.1",
  "coverage==7.15.4",
]
# P-001比較（ADR-0003）の再現専用。runtime依存ではない。
p001 = [
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
# 対象はsrc配下のpackageとし、strictから開始する。対象は広げる方向のみ変更可。
files = ["src"]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
source = ["claude_code_codex_review_loop"]
# subprocessとして起動した子processも自動計測する。parallel dataのためreport前にcombineが必要。
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
